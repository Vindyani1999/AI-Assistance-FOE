version: "3.9"

services:
  backend:
    build: .
    container_name: agentgraph-backend
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017
      - TIKTOKEN_CACHE_DIR=/app/.tiktoken_cache
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    command: ["uvicorn", "apps.fastapi_app:app", "--host", "0.0.0.0", "--port", "9000"]
